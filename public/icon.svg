<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#be123c" />
      <stop offset="50%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#9f1239" />
    </linearGradient>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ffe4e6" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- App Icon Background Rounded Superellipse -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  
  <!-- Subtle Inner Ring Highlight -->
  <rect x="12" y="12" width="488" height="488" rx="103" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.15" />

  <!-- Main Blood Droplet Silhouette -->
  <path d="M 256 70 C 256 70 140 220 140 320 C 140 384 192 436 256 436 C 320 436 372 384 372 320 C 372 220 256 70 256 70 Z" 
        fill="url(#dropGrad)" 
        filter="url(#shadow)" />

  <!-- Heartbeat ECG Pulse Line inside the drop -->
  <path d="M 180 320 L 220 320 L 235 270 L 255 370 L 275 295 L 290 320 L 332 320" 
        fill="none" 
        stroke="#e11d48" 
        stroke-width="14" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Medical Cross Badge in Top-Right corner of droplet -->
  <g transform="translate(320, 150) scale(0.9)">
    <circle cx="20" cy="20" r="32" fill="#ffffff" filter="url(#shadow)" />
    <path d="M 14 6 H 26 V 14 H 34 V 26 H 26 V 34 H 14 V 26 H 6 V 14 H 14 Z" fill="#e11d48" />
  </g>
</svg>
